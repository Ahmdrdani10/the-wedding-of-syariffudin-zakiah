<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Undangan Digital</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    @keyframes envelope-shake {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      20%       { transform: rotate(-5deg) translateY(-5px); }
      40%       { transform: rotate(5deg) translateY(-8px); }
      60%       { transform: rotate(-4deg) translateY(-4px); }
      80%       { transform: rotate(3deg) translateY(-7px); }
    }

    #envelope-open-overlay {
      background: radial-gradient(ellipse at center,
        rgba(26,10,46,0.95) 0%,
        rgba(10,4,20,0.98) 100%
      );
      transition: opacity 0.4s ease;
    }

    @keyframes sparkle-burst {
      0%   { transform: scale(0) rotate(0deg); opacity: 1; }
      100% { transform: scale(1.5) rotate(180deg); opacity: 0; }
    }

    .sparkle {
      position: absolute;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255, 215, 0, 0.8);
      animation: sparkle-burst 0.6s ease-out forwards;
      pointer-events: none;
    }

    @keyframes float-slow {
      0%, 100% { transform: translateY(0) scale(1); }
      50%       { transform: translateY(-10px) scale(1.05); }
    }
  </style>
</head>
<body>

<!-- ================================================
     SCENE: HALAMAN PREVIEW UNDANGAN
     ================================================ -->
<div id="scene">

  <div id="bg-layer"></div>

  <!-- Panel Kiri -->
  <div id="panel-left">
    <div class="panel-deco">
      <div class="deco-tree"></div>
      <div class="deco-flower"></div>
      <div class="deco-flower"></div>
      <div class="deco-flower"></div>
      <div style="
        position: absolute; top: 10%; right: 15%;
        width: 50px; height: 50px;
        border-radius: 50%;
        box-shadow: inset -12px 0 0 rgba(255,215,0,0.3);
        opacity: 0.6;
        animation: float-slow 6s ease-in-out infinite;
      "></div>
      <div style="
        position: absolute; top: 5%; bottom: 5%; right: 25%;
        width: 1px;
        background: linear-gradient(180deg,
          transparent 0%, rgba(180,140,60,0.2) 30%,
          rgba(180,140,60,0.4) 50%,
          rgba(180,140,60,0.2) 70%, transparent 100%
        );
        animation: float-slow 5s ease-in-out 1s infinite;
      "></div>
    </div>
    <div class="panel-border"></div>
  </div>

  <!-- Panel Kanan -->
  <div id="panel-right">
    <div class="panel-deco">
      <div class="deco-tree"></div>
      <div class="deco-flower"></div>
      <div class="deco-flower"></div>
      <div class="deco-flower"></div>
      <div style="
        position: absolute; top: 15%; left: 20%;
        width: 40px; height: 40px;
        border-radius: 50%;
        box-shadow: inset 10px 0 0 rgba(255,215,0,0.25);
        opacity: 0.5;
        animation: float-slow 7s ease-in-out 2s infinite;
      "></div>
      <div style="
        position: absolute; top: 5%; bottom: 5%; left: 25%;
        width: 1px;
        background: linear-gradient(180deg,
          transparent 0%, rgba(180,140,60,0.2) 30%,
          rgba(180,140,60,0.4) 50%,
          rgba(180,140,60,0.2) 70%, transparent 100%
        );
        animation: float-slow 5s ease-in-out 3s infinite;
      "></div>
    </div>
    <div class="panel-border"></div>
  </div>

  <!-- Konten Tengah -->
  <div id="center-content">
    <div class="preview-title">THE WEDDING OF</div>
    <div class="preview-names">Fulan &amp;<br>Fulani</div>

    <div id="envelope-container" title="Klik untuk membuka undangan">
      <img id="envelope-img"
           src="../assets/img/envelope/frame1.webp"
           alt="Amplop Undangan">
      <div id="envelope-placeholder" style="display:none;">
        <div class="env-body">
          <div class="env-flap-left"></div>
          <div class="env-flap-right"></div>
          <div class="env-seal">♥</div>
        </div>
        <div class="env-flap"></div>
      </div>
    </div>

    <div class="envelope-hint">✦ Sentuh untuk membuka ✦</div>
  </div>

</div><!-- /#scene -->



<!-- Overlay animasi buka amplop -->
<div id="envelope-open-overlay">
  <div id="frame-display"></div>
</div>

<!-- Overlay transisi -->
<div id="transition-overlay"></div>

<!-- Scripts -->
<script src="../assets/js/jquery.3.4.1.slim.min.js"></script>
<script src="../assets/js/bootstrap.min.js"></script>
<script>
  // Path asset untuk preview — dibaca oleh main.js
  const ASSET_BASE = '../assets/img/';
</script>
<script src="../assets/js/main.js"></script>

</body>
</html>
